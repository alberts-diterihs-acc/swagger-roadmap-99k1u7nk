openapi: '3.0.0'
info:
  title: Patient API
  version: 1.0.0
  description: REST API for managing patient records
servers:
  - url: http://localhost:3000/api/v1
components:
  schemas:
    Patient:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: 621c7f80-cefb-47d5-b2b4-01f7c3f25b99
        patient_id:
          type: string
          example: P1002
        patient_name:
          type: string
          example: Jane Smith
        gender:
          type: string
          example: Female
        date_of_birth:
          type: string
          format: date
          example: '1990-09-28'
        visit_date:
          type: string
          format: date
          example: '2023-01-05'
        symptoms:
          type: string
          example: Cough and Sore Throat
        diagnosis:
          type: string
          example: Bronchitis
        medication:
          type: string
          example: Amoxicillin
        dosage:
          type: string
          example: 500mg
    PatientInput:
      type: object
      required:
        - patient_id
        - patient_name
        - gender
        - date_of_birth
        - visit_date
        - symptoms
        - diagnosis
        - medication
        - dosage
      properties:
        patient_id:
          type: string
          example: P1005
        patient_name:
          type: string
          example: John Doe
        gender:
          type: string
          example: Male
        date_of_birth:
          type: string
          format: date
          example: '1985-03-12'
        visit_date:
          type: string
          format: date
          example: '2024-06-01'
        symptoms:
          type: string
          example: Fever and Fatigue
        diagnosis:
          type: string
          example: Influenza
        medication:
          type: string
          example: Oseltamivir
        dosage:
          type: string
          example: 75mg
    Error:
      type: object
      properties:
        error:
          type: string
          example: No patient found with the provided ID.
paths:
  /patients:
    get:
      summary: Retrieve all patients
      tags:
        - Patients
      responses:
        '200':
          description: A list of patients
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Patient'
              examples:
                success:
                  summary: Two patients returned
                  value:
                    - id: 621c7f80-cefb-47d5-b2b4-01f7c3f25b99
                      patient_id: P1002
                      patient_name: Jane Smith
                      gender: Female
                      date_of_birth: '1990-09-28'
                      visit_date: '2023-01-05'
                      symptoms: Cough and Sore Throat
                      diagnosis: Bronchitis
                      medication: Amoxicillin
                      dosage: 500mg
                    - id: 4aff6cbc-892b-4dbf-bfa7-ad0f0a346eb1
                      patient_id: P1003
                      patient_name: Michael Johnson
                      gender: Male
                      date_of_birth: '1978-06-15'
                      visit_date: '2023-01-08'
                      symptoms: Headache
                      diagnosis: Migraine
                      medication: Ibuprofen
                      dosage: 400mg
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                error:
                  value:
                    error: An internal server error occurred.
    post:
      summary: Create a new patient
      tags:
        - Patients
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatientInput'
            examples:
              newPatient:
                summary: New patient record
                value:
                  patient_id: P1005
                  patient_name: John Doe
                  gender: Male
                  date_of_birth: '1985-03-12'
                  visit_date: '2024-06-01'
                  symptoms: Fever and Fatigue
                  diagnosis: Influenza
                  medication: Oseltamivir
                  dosage: 75mg
      responses:
        '201':
          description: Patient created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Patient'
              examples:
                created:
                  summary: Created patient with generated ID
                  value:
                    id: a1b2c3d4-e5f6-7890-abcd-ef1234567890
                    patient_id: P1005
                    patient_name: John Doe
                    gender: Male
                    date_of_birth: '1985-03-12'
                    visit_date: '2024-06-01'
                    symptoms: Fever and Fatigue
                    diagnosis: Influenza
                    medication: Oseltamivir
                    dosage: 75mg
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                error:
                  value:
                    error: An internal server error occurred.
  /patients/{id}:
    get:
      summary: Retrieve a patient by ID
      tags:
        - Patients
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          description: The patient UUID
          example: 621c7f80-cefb-47d5-b2b4-01f7c3f25b99
      responses:
        '200':
          description: A single patient
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Patient'
              examples:
                found:
                  summary: Patient found
                  value:
                    id: 621c7f80-cefb-47d5-b2b4-01f7c3f25b99
                    patient_id: P1002
                    patient_name: Jane Smith
                    gender: Female
                    date_of_birth: '1990-09-28'
                    visit_date: '2023-01-05'
                    symptoms: Cough and Sore Throat
                    diagnosis: Bronchitis
                    medication: Amoxicillin
                    dosage: 500mg
        '404':
          description: Patient not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                notFound:
                  value:
                    error: No patient found with the provided ID.
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                error:
                  value:
                    error: An internal server error occurred.
    put:
      summary: Update a patient by ID
      tags:
        - Patients
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          description: The patient UUID
          example: 621c7f80-cefb-47d5-b2b4-01f7c3f25b99
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatientInput'
            examples:
              updatePatient:
                summary: Updated diagnosis and medication
                value:
                  patient_id: P1002
                  patient_name: Jane Smith
                  gender: Female
                  date_of_birth: '1990-09-28'
                  visit_date: '2023-01-05'
                  symptoms: Cough and Sore Throat
                  diagnosis: Pneumonia
                  medication: Clarithromycin
                  dosage: 250mg
      responses:
        '200':
          description: Patient updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Patient'
              examples:
                updated:
                  summary: Patient after update
                  value:
                    id: 621c7f80-cefb-47d5-b2b4-01f7c3f25b99
                    patient_id: P1002
                    patient_name: Jane Smith
                    gender: Female
                    date_of_birth: '1990-09-28'
                    visit_date: '2023-01-05'
                    symptoms: Cough and Sore Throat
                    diagnosis: Pneumonia
                    medication: Clarithromycin
                    dosage: 250mg
        '404':
          description: Patient not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                notFound:
                  value:
                    error: No patient found with the provided ID.
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                error:
                  value:
                    error: An internal server error occurred.
    delete:
      summary: Delete a patient by ID
      tags:
        - Patients
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          description: The patient UUID
          example: 621c7f80-cefb-47d5-b2b4-01f7c3f25b99
      responses:
        '204':
          description: Patient deleted successfully
        '404':
          description: Patient not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                notFound:
                  value:
                    error: No patient found with the provided ID.
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                error:
                  value:
                    error: An internal server error occurred.
